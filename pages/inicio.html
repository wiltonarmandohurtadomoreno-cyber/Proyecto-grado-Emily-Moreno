<!-- =========================================================
     ESTILOS (puedes pasarlos a tu archivo CSS si prefieres)
     ========================================================= -->
<style>
    /* ---------- Carrusel ---------- */
    .carousel-container {
        max-width: 850px;          /* Ancho máximo del carrusel */
        margin: 2.5rem auto;
        padding: 0 16px;
    }

    .carousel-container .carousel {
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(13, 110, 253, 0.18);
    }

    .carousel-container .carousel-item img {
        height: 360px;             /* Alto del carrusel en computador */
        object-fit: cover;
    }

    .carousel-container .carousel-indicators button {
        width: 12px;
        height: 12px;
        border-radius: 50%;
    }

    @media (max-width: 768px) {
        .carousel-container .carousel-item img {
            height: 200px;         /* Alto del carrusel en celular */
        }
    }

    /* ---------- Galería de videos ---------- */
    .video-card {
        border: none;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 6px 16px rgba(13, 110, 253, 0.12);
        transition: transform 0.25s, box-shadow 0.25s;
    }

    .video-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 24px rgba(13, 110, 253, 0.2);
    }

    .video-card .card-img-top {
        height: 200px;
        object-fit: cover;
    }

    .video-card .card-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: #0d6efd;
    }

    .video-modal video {
        border-radius: 10px;
        background: #000;
    }
</style>


<!-- =========================================================
     CARRUSEL
     ========================================================= -->
<div class="carousel-container">
    <div id="carouselPastel" class="carousel slide" data-bs-ride="carousel">

        <!-- Indicadores -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselPastel" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Imagen 1"></button>
            <button type="button" data-bs-target="#carouselPastel" data-bs-slide-to="1"
                aria-label="Imagen 2"></button>
            <button type="button" data-bs-target="#carouselPastel" data-bs-slide-to="2"
                aria-label="Imagen 3"></button>
        </div>

        <!-- Imágenes -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/banner1.png" class="d-block w-100" alt="Banner 1 sobre la prevención del vapeo">
            </div>
            <div class="carousel-item">
                <img src="img/banner2.png" class="d-block w-100" alt="Banner 2 sobre la prevención del vapeo">
            </div>
            <div class="carousel-item">
                <img src="img/banner3.png" class="d-block w-100" alt="Banner 3 sobre la prevención del vapeo">
            </div>
        </div>

        <!-- Botón anterior -->
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselPastel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>

        <!-- Botón siguiente -->
        <button class="carousel-control-next" type="button" data-bs-target="#carouselPastel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
        </button>

    </div>
</div>


<!-- =========================================================
     GALERÍA DE VIDEOS
     ========================================================= -->
<section class="container my-5">
    <h2 class="text-center section-title">Galería de videos</h2>
    <p class="text-center mb-4">Haz clic en cada video para verlo.</p>

    <div class="row g-4">

        <!-- Video 1 -->
        <div class="col-md-4">
            <div class="card video-card h-100">
                <img src="img/miniatura1.png" class="card-img-top" alt="Miniatura del video 1">
                <div class="card-body text-center">
                    <h5 class="card-title">Video 1</h5>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalVideo1">
                        ▶ Ver video
                    </button>
                </div>
            </div>
        </div>

        <!-- Video 2 -->
        <div class="col-md-4">
            <div class="card video-card h-100">
                <img src="img/miniatura2.png" class="card-img-top" alt="Miniatura del video 2">
                <div class="card-body text-center">
                    <h5 class="card-title">Video 2</h5>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalVideo2">
                        ▶ Ver video
                    </button>
                </div>
            </div>
        </div>

        <!-- Video 3 -->
        <div class="col-md-4">
            <div class="card video-card h-100">
                <img src="img/miniatura3.png" class="card-img-top" alt="Miniatura del video 3">
                <div class="card-body text-center">
                    <h5 class="card-title">Video 3</h5>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalVideo3">
                        ▶ Ver video
                    </button>
                </div>
            </div>
        </div>

    </div>
</section>


<!-- =========================================================
     VENTANAS DE LOS VIDEOS (MODALES)
     ========================================================= -->

<!-- Modal video 1 -->
<div class="modal fade video-modal" id="modalVideo1" tabindex="-1" aria-labelledby="tituloVideo1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header background-modal-header">
                <h5 class="modal-title" id="tituloVideo1">Video 1</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <video class="w-100" controls>
                    <source src="videos/video1.mp4" type="video/mp4">
                    Tu navegador no soporta videos HTML5.
                </video>
            </div>
        </div>
    </div>
</div>

<!-- =========================================================
     Detiene el video cuando se cierra la ventana
     (ponlo después del script de Bootstrap)
     ========================================================= -->
<script>
    document.querySelectorAll('.video-modal').forEach(function (modal) {
        modal.addEventListener('hidden.bs.modal', function () {
            modal.querySelectorAll('video').forEach(function (video) {
                video.pause();
                video.currentTime = 0;
            });
        });
    });
</script>
