<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corre Sin Vaper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Baloo+2:wght@500;700;800&display=swap">
<style>
  /* Layout: one-screen arcade cabinet — the game canvas fills the stage, a thin caption strip below. Single dark look by choice. */
  :root {
    --noche: #120a22;
    --noche-2: #1f1238;
    --calabaza: #f08a3a;
    --vela: #ffd56b;
    --hueso: #f6efe4;
    --niebla: #b6a6cf;
    --rosa: #ff6fb5;
    --f-display: "Creepster", "Chiller", fantasy, cursive;
    --f-body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--noche);
    color: var(--hueso);
    font-family: var(--f-body);
    display: flex; flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
    gap: 10px;
    overflow: hidden;
  }
  #escenario {
    position: relative; flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #juego { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #juego canvas { border-radius: 14px; box-shadow: 0 0 0 1px #ffffff14, 0 18px 50px #000a; }
  .pie {
    display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center;
    font-size: 14px; color: var(--niebla); text-align: center;
  }
  .pie kbd {
    font-family: var(--f-body); font-weight: 700; color: var(--hueso);
    background: var(--noche-2); border: 1px solid #ffffff22; border-bottom-width: 3px;
    border-radius: 6px; padding: 0 7px; font-size: 13px;
  }

  /* Modal */
  .velo {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: #0b0616cc; backdrop-filter: blur(3px);
    padding: 16px; z-index: 5;
  }
  .tarjeta {
    width: min(460px, 100%);
    background: linear-gradient(180deg, #2a1748, #1a0f30);
    border: 2px solid var(--vela);
    border-radius: 18px;
    padding: 22px 24px 20px;
    box-shadow: 0 0 40px #ffd56b33, 0 20px 60px #000c;
    display: flex; flex-direction: column; gap: 12px;
    animation: entra .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes entra { from { transform: scale(.85) translateY(10px); opacity: 0; } }
  .etiqueta {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--vela);
  }
  .progreso { display: flex; gap: 4px; margin-left: auto; }
  .progreso i { width: 10px; height: 10px; border-radius: 50%; background: #ffffff1f; }
  .progreso i.ok { background: var(--vela); box-shadow: 0 0 6px var(--vela); }
  .tarjeta h2 {
    font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 6vw, 38px);
    line-height: 1.05; margin: 0; color: var(--calabaza); letter-spacing: .02em; text-wrap: balance;
  }
  .tarjeta p { margin: 0; font-size: 18px; line-height: 1.45; color: var(--hueso); }
  .boton {
    margin-top: 6px; align-self: flex-start;
    font: 800 17px var(--f-body); color: var(--noche);
    background: var(--vela); border: 0; border-radius: 999px;
    padding: 10px 22px; cursor: pointer;
    box-shadow: 0 4px 0 #b98a1e;
  }
  .boton:hover { filter: brightness(1.07); }
  .boton:active { transform: translateY(2px); box-shadow: 0 2px 0 #b98a1e; }
  .boton:focus-visible { outline: 3px solid var(--rosa); outline-offset: 3px; }
  .datos { display: flex; gap: 22px; font-variant-numeric: tabular-nums; }
  .datos div { display: flex; flex-direction: column; }
  .datos b { font-size: 26px; color: var(--vela); line-height: 1.1; }
  .datos span { font-size: 13px; color: var(--niebla); text-transform: uppercase; letter-spacing: .06em; }
  @media (prefers-reduced-motion: reduce) { .tarjeta { animation: none; } }
</style>

</head>
<body>
<div id="escenario">
  <div id="juego"></div>
  <div class="velo" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="tarjeta">
      <div class="etiqueta"><span aria-hidden="true">ℹ️</span><span id="modal-etiqueta">Consejo</span><span class="progreso" id="modal-progreso"></span></div>
      <h2 id="modal-titulo"></h2>
      <p id="modal-texto"></p>
      <div class="datos" id="modal-datos" hidden></div>
      <button class="boton" id="modal-boton" type="button">Seguir corriendo</button>
    </div>
  </div>
</div>
<div class="pie">
  <span><kbd>Espacio</kbd> / <kbd>↑</kbd> o toca la pantalla para saltar</span>
  <span>Recoge ⭐ para descubrir consejos · esquiva los vapers</span>
</div>

  ["Aléjate de las tentaciones", "Evita tener el vaper a la mano."],
  ["Identifica tus desencadenantes", "Reconoce cuándo te dan más ganas de vapear."],
  ["Toma más agua", "Mantén una botella cerca para reemplazar el hábito."],
  ["Mastica chicle", "Mantén tu boca ocupada cuando sientas ansiedad."],
  ["Haz ejercicio", "Camina, monta bicicleta o practica algún deporte."],
  ["Evita las situaciones que te incitan", "Aléjate temporalmente de los lugares donde sueles vapear."],
  ["Busca apoyo", "Cuéntales a tus amigos o familiares que quieres dejarlo."],
  ["Ahorra el dinero", "Guarda lo que gastarías en vaper y observa cuánto acumulas."],
  ["No te rindas si recaes", "Si vuelves a vapear, aprende de la experiencia y continúa con tu objetivo."]
];

const ANCHO = 960, ALTO = 540, SUELO = 512;
const GRAVEDAD = 1900, SALTO = -760;

/* ---------- Modal (HTML sobre el canvas) ---------- */
const modal = {
  el: document.getElementById("modal"),
  abierto: false, alCerrar: null,
  mostrar({ etiqueta, titulo, texto, boton, datos, vistos }) {
    document.getElementById("modal-etiqueta").textContent = etiqueta;
    document.getElementById("modal-titulo").textContent = titulo;
    document.getElementById("modal-texto").textContent = texto;
    const p = document.getElementById("modal-progreso");
    p.innerHTML = "";
    if (vistos != null) for (let i = 0; i < CONSEJOS.length; i++) {
      const d = document.createElement("i"); if (i < vistos) d.className = "ok"; p.appendChild(d);
    }
    const dt = document.getElementById("modal-datos");
    dt.hidden = !datos;
    dt.innerHTML = datos ? datos.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("") : "";
    const b = document.getElementById("modal-boton");
    b.textContent = boton;
    this.el.hidden = false; this.abierto = true;
    setTimeout(() => b.focus(), 50);
    return new Promise(res => { this.alCerrar = res; });
  },
  cerrar() {
    if (!this.abierto) return;
    this.el.hidden = true; this.abierto = false;
    const f = this.alCerrar; this.alCerrar = null; f && f();
  }
};
document.getElementById("modal-boton").addEventListener("click", () => modal.cerrar());
window.addEventListener("keydown", e => {
  if (modal.abierto && (e.key === "Enter" || e.key === " " || e.key === "Escape")) {
    e.preventDefault(); e.stopImmediatePropagation(); modal.cerrar();
  }
}, true);

let record = 0;
try { record = +localStorage.getItem("corre-sin-vaper-record") || 0; } catch (e) {}

/* ---------- Escena 1: arranque (solo carga el sprite de "loading") ---------- */
class Arranque extends Phaser.Scene {
  constructor() { super("Arranque"); }
  preload() { this.load.spritesheet("loading", IMG.loading, { frameWidth: 960, frameHeight: 540 }); }
  create() { this.scene.start("Carga"); }
}

/* ---------- Escena 2: pantalla de carga animada ---------- */
class Carga extends Phaser.Scene {
  constructor() { super("Carga"); }
  preload() {
    this.add.rectangle(0, 0, ANCHO, ALTO, 0x000000).setOrigin(0);
    this.anims.create({ key: "cargando", frames: this.anims.generateFrameNumbers("loading", { start: 0, end: 4 }), frameRate: 2, repeat: 0 });
    this.pantalla = this.add.sprite(ANCHO / 2, ALTO / 2, "loading", 0);
    this.animTerminada = false;
    this.pantalla.on("animationcomplete", () => { this.animTerminada = true; this.intentarSalir(); });
    this.pantalla.play("cargando");

    this.load.image("fondo", IMG.fondo);
    this.load.spritesheet("chica", IMG.personaje, { frameWidth: 130, frameHeight: 220 });
    this.load.image("vaper", IMG.obstaculo);
  }
  create() { this.cargaLista = true; this.intentarSalir(); }
  intentarSalir() {
    if (!this.animTerminada || !this.cargaLista || this.saliendo) return;
    this.saliendo = true;
    this.time.delayedCall(350, () => {
      this.cameras.main.fadeOut(400, 0, 0, 0);
      this.cameras.main.once("camerafadeoutcomplete", () => this.scene.start("Juego"));
    });
  }
}

/* ---------- Escena 3: el juego ---------- */
class Juego extends Phaser.Scene {
  constructor() { super("Juego"); }

  crearTexturas() {
    if (this.textures.exists("cielo")) return;
    const c = this.textures.createCanvas("cielo", ANCHO, ALTO);
    const ctx = c.getContext();
    const g = ctx.createLinearGradient(0, 0, 0, ALTO);
    g.addColorStop(0, "#130a26"); g.addColorStop(0.45, "#3b1d5e");
    g.addColorStop(0.78, "#a4416b"); g.addColorStop(1, "#f08a3a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, ANCHO, ALTO);
    for (let i = 0; i < 90; i++) {
      ctx.fillStyle = `rgba(255,240,220,${Math.random() * 0.7 + 0.2})`;
      const s = Math.random() < 0.15 ? 2 : 1;
      ctx.fillRect(Math.random() * ANCHO, Math.random() * ALTO * 0.5, s, s);
    }
    const lx = 760, ly = 110;
    const halo = ctx.createRadialGradient(lx, ly, 30, lx, ly, 150);
    halo.addColorStop(0, "rgba(255,230,180,0.45)"); halo.addColorStop(1, "rgba(255,230,180,0)");
    ctx.fillStyle = halo; ctx.fillRect(lx - 160, ly - 160, 320, 320);
    ctx.fillStyle = "#fff1cf"; ctx.beginPath(); ctx.arc(lx, ly, 48, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(220,190,150,0.35)";
    [[-14, -10, 9], [12, 8, 12], [-6, 20, 6]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(lx + x, ly + y, r, 0, Math.PI * 2); ctx.fill(); });
    c.refresh();

    const s = this.make.graphics({ x: 0, y: 0, add: false });
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 11 : 26, a = -Math.PI / 2 + i * Math.PI / 5;
      pts.push(new Phaser.Geom.Point(30 + Math.cos(a) * r, 30 + Math.sin(a) * r));
    }
    s.fillStyle(0xffd56b, 0.25); s.fillCircle(30, 30, 30);
    s.fillStyle(0xffc23a); s.fillPoints(pts, true);
    s.lineStyle(3, 0xfff3c4); s.strokePoints(pts, true, true);
    s.generateTexture("estrella", 60, 60); s.destroy();
  }

  create() {
    this.crearTexturas();
    this.cameras.main.fadeIn(500, 0, 0, 0);

    this.add.image(0, 0, "cielo").setOrigin(0);
    this.niebla = this.add.tileSprite(0, ALTO - 423 - 40, ANCHO, 423, "fondo").setOrigin(0).setAlpha(0.18).setTint(0x2a1640);
    this.fondo = this.add.tileSprite(0, ALTO - 423, ANCHO, 423, "fondo").setOrigin(0);

    const piso = this.add.rectangle(0, SUELO, ANCHO * 2, 60, 0x000000, 0).setOrigin(0);
    this.physics.add.existing(piso, true);

    if (!this.anims.exists("caminar")) {
      this.anims.create({ key: "caminar", frames: this.anims.generateFrameNumbers("chica", { start: 0, end: 7 }), frameRate: 12, repeat: -1 });
    }
    this.chica = this.physics.add.sprite(170, SUELO - 70, "chica", 0).setScale(0.6).setDepth(5);
    this.chica.body.setSize(58, 196).setOffset(36, 20);
    this.chica.body.setGravityY(GRAVEDAD);
    this.physics.add.collider(this.chica, piso);

    this.vapers = this.physics.add.group({ allowGravity: false, immovable: true });
    this.estrellas = this.physics.add.group({ allowGravity: false });
    this.physics.add.overlap(this.chica, this.vapers, () => this.perder());
    this.physics.add.overlap(this.chica, this.estrellas, (_, e) => this.recoger(e));

    this.velocidad = 330;
    this.distancia = 0;
    this.puntos = 0;
    this.vistos = 0;
    this.corriendo = false;
    this.terminado = false;
    this.bloqueoSalto = 0;

    const estilo = { fontFamily: '"Baloo 2", sans-serif', fontSize: "24px", fontStyle: "800", color: "#fff1cf", stroke: "#120a22", strokeThickness: 6 };
    this.txtEstrellas = this.add.text(22, 16, "⭐ 0 / 9", estilo).setDepth(10);
    this.txtDist = this.add.text(ANCHO - 22, 16, "0 m", estilo).setOrigin(1, 0).setDepth(10);
    this.txtRecord = this.add.text(ANCHO - 22, 46, record ? `Récord ${record} m` : "", { ...estilo, fontSize: "16px", color: "#d9c8f0" }).setOrigin(1, 0).setDepth(10);

    this.titulo = this.add.text(ANCHO / 2, 150, "Corre sin vaper", {
      fontFamily: '"Creepster", fantasy', fontSize: "72px", color: "#f08a3a", stroke: "#120a22", strokeThickness: 10
    }).setOrigin(0.5).setDepth(10);
    this.aviso = this.add.text(ANCHO / 2, 225, "Pulsa ESPACIO o toca para empezar", { ...estilo, fontSize: "22px" }).setOrigin(0.5).setDepth(10);
    this.tweens.add({ targets: this.aviso, alpha: 0.35, duration: 700, yoyo: true, repeat: -1 });
    this.tweens.add({ targets: this.titulo, y: 158, duration: 1400, yoyo: true, repeat: -1, ease: "Sine.inOut" });

    this.teclas = this.input.keyboard.addKeys("SPACE,UP,W");
    this.input.on("pointerdown", () => this.accion());
    this.teclas.SPACE.on("down", () => this.accion());
    this.teclas.UP.on("down", () => this.accion());
    this.teclas.W.on("down", () => this.accion());
  }

  accion() {
    if (modal.abierto || this.terminado) return;
    if (this.time.now < this.bloqueoSalto) return;
    if (!this.corriendo) return this.empezar();
    if (this.chica.body.blocked.down || this.chica.body.touching.down) {
      this.chica.setVelocityY(SALTO);
    }
  }

  empezar() {
    this.corriendo = true;
    this.tweens.killTweensOf([this.aviso, this.titulo]);
    this.tweens.add({ targets: [this.aviso, this.titulo], alpha: 0, duration: 300, onComplete: () => { this.aviso.destroy(); this.titulo.destroy(); } });
    this.chica.play("caminar");
    this.programar(900);
  }

  programar(ms) { this.time.delayedCall(ms, () => this.generar()); }

  generar() {
    if (this.terminado) return;
    const x = ANCHO + 60;
    const v = this.vapers.create(x, SUELO + 4, "vaper").setOrigin(0.5, 1).setScale(0.78);
    v.body.setSize(38, 100).setOffset(13, 22);
    v.setVelocityX(-this.velocidad);

    const r = Math.random();
    if (r < 0.4) {
      this.crearEstrella(x, SUELO - 205);            // encima del vaper: hay que saltar
    } else if (r < 0.75) {
      this.crearEstrella(x + this.velocidad * 0.7, SUELO - 55); // en el camino, entre obstáculos
    }
    this.programar(Phaser.Math.Between(1150, 2000));
  }

  crearEstrella(x, y) {
    const e = this.estrellas.create(x, y, "estrella");
    e.body.setCircle(22, 8, 8);
    e.setVelocityX(-this.velocidad);
    this.tweens.add({ targets: e, angle: 360, duration: 2400, repeat: -1 });
    this.tweens.add({ targets: e, scale: 1.12, duration: 500, yoyo: true, repeat: -1, ease: "Sine.inOut" });
  }

  recoger(e) {
    if (!e.active || this.terminado) return;
    e.destroy();
    this.puntos++;
    const consejo = CONSEJOS[(this.puntos - 1) % CONSEJOS.length];
    this.vistos = Math.min(CONSEJOS.length, this.vistos + 1);
    this.txtEstrellas.setText(`⭐ ${this.vistos} / 9`);
    const destello = this.add.image(this.chica.x, this.chica.y - 40, "estrella").setDepth(8);
    this.tweens.add({ targets: destello, scale: 2.4, alpha: 0, duration: 350 });
    this.time.delayedCall(120, () => {
      this.scene.pause();
      modal.mostrar({
        etiqueta: `Consejo ${((this.puntos - 1) % CONSEJOS.length) + 1} de 9`,
        titulo: consejo[0], texto: consejo[1],
        boton: "Seguir corriendo", vistos: this.vistos
      }).then(() => { this.bloqueoSalto = this.time.now + 200; this.scene.resume(); });
    });
  }

  perder() {
    if (this.terminado) return;
    this.terminado = true;
    this.physics.pause();
    this.chica.anims.stop();
    this.chica.setTint(0xff7777);
    this.cameras.main.shake(250, 0.01);
    const m = Math.floor(this.distancia);
    const nuevo = m > record;
    if (nuevo) { record = m; try { localStorage.setItem("corre-sin-vaper-record", String(m)); } catch (e) {} }
    this.time.delayedCall(500, () => {
      modal.mostrar({
        etiqueta: "Fin de la carrera",
        titulo: nuevo ? "¡Nuevo récord!" : "El vaper te alcanzó",
        texto: "Cada intento cuenta. Vuelve a correr y sigue reuniendo consejos para dejarlo.",
        datos: [[`${m} m`, "Distancia"], [this.puntos, "Estrellas"], [`${record} m`, "Récord"]],
        boton: "Jugar otra vez", vistos: this.vistos
      }).then(() => this.scene.restart());
    });
  }

  update(_, dt) {
    if (!this.corriendo || this.terminado) return;
    const s = dt / 1000;
    this.velocidad = Math.min(680, this.velocidad + 7 * s);
    this.fondo.tilePositionX += this.velocidad * s;
    this.niebla.tilePositionX += this.velocidad * s * 0.35;
    this.distancia += this.velocidad * s / 40;
    this.txtDist.setText(`${Math.floor(this.distancia)} m`);

    this.vapers.getChildren().forEach(v => { v.setVelocityX(-this.velocidad); if (v.x < -80) v.destroy(); });
    this.estrellas.getChildren().forEach(e => { e.setVelocityX(-this.velocidad); if (e.x < -80) e.destroy(); });

    const enSuelo = this.chica.body.blocked.down || this.chica.body.touching.down;
    if (enSuelo) { if (!this.chica.anims.isPlaying) this.chica.play("caminar"); }
    else { this.chica.anims.pause(); this.chica.setFrame(2); }
    if (enSuelo && this.chica.anims.isPaused) this.chica.anims.resume();
  }
}

const iniciar = () => new Phaser.Game({
  type: Phaser.AUTO,
  parent: "juego",
  width: ANCHO, height: ALTO,
  backgroundColor: "#000000",
  physics: { default: "arcade", arcade: { debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [Arranque, Carga, Juego]
});
Promise.race([
  Promise.all([document.fonts.load('72px "Creepster"'), document.fonts.load('800 24px "Baloo 2"')]),
  new Promise(r => setTimeout(r, 1500))
]).then(iniciar, iniciar);
</script>

</body>
</html>
